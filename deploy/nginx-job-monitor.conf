# ==============================================================================
# Plantilla Nginx Reverse Proxy para JOB-Monitor (Puerto 80/443 -> 127.0.0.1:5080)
# ==============================================================================
# Uso:
#   1. Reemplaza "monitor.tudominio.com" por tu subdominio real.
#   2. Copia a /etc/nginx/sites-available/job-monitor
#   3. Activa con: ln -s /etc/nginx/sites-available/job-monitor /etc/nginx/sites-enabled/
#   4. Genera SSL gratis con: certbot --nginx -d monitor.tudominio.com
# ==============================================================================

server {
    listen 80;
    server_name monitor.tudominio.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        # Soporte completo para WebSockets (/ws/agent y /ws/admin)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

